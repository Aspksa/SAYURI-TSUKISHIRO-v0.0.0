<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAYURI TSUKISHIRO</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark;background:#0e1220;color:#eff3ff}
body{max-width:720px;margin:5vh auto;padding:18px}
header{border-bottom:1px solid #3b4564;padding-bottom:20px}
h1{font-size:clamp(24px,4vw,38px);letter-spacing:.06em}small{color:#aac0ed}
section{background:#192137;padding:24px;margin-top:24px;border-radius:14px}
textarea,button{font:inherit;box-sizing:border-box;width:100%;border-radius:9px;padding:12px}
textarea{background:#0e1220;color:#fff;border:1px solid #64738f}
button{background:#91aaff;border:0;color:#081020;font-weight:700;margin-top:10px;cursor:pointer}
li{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}
</style></head><body>
<header><small>PORTABLE • LOCAL • 0.0.0</small><h1>SAYURI TSUKISHIRO</h1><div id="status">Запуск ядра…</div></header>
<section><h2>Локальная база</h2><form id="form">
<textarea id="text" maxlength="2000" required rows="3" placeholder="Новая заметка"></textarea>
<button>Сохранить</button></form><p id="error" role="alert"></p><ul id="notes"></ul></section>
<script>
const el=id=>document.getElementById(id);
async function api(path,options){let response=await fetch(path,options),data=await response.json();
if(!response.ok)throw Error(data.error||"Error");return data;}
async function load(){
try{
let status=await api("/api/status"),notes=await api("/api/notes");
el("status").textContent=status.name+" • "+status.version+" • SQLite: "+status.database;
el("notes").replaceChildren();for(let n of notes.notes){let item=document.createElement("li");item.textContent=n.text;el("notes").append(item)}
}catch(e){el("error").textContent=e.message}}
el("form").onsubmit=async e=>{e.preventDefault();el("error").textContent="";
try{await api("/api/notes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:el("text").value})});el("text").value="";await load()}catch(err){el("error").textContent=err.message}};
load();
</script></body></html>
